  <style>
    /* ---- Month tab bar ---- */
    .month-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .month-btn {
      padding: 6px 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .month-btn:hover  { border-color: var(--blue); color: var(--blue); }
    .month-btn.active { background: var(--navy); border-color: var(--navy); color: white; }

    /* ---- Statement grid ---- */
    .stmt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) { .stmt-grid { grid-template-columns: 1fr; } }

    @media (max-width: 600px) {
      .stmt-table { font-size: 11px; }
      .stmt-table td, .stmt-table thead th { padding: 5px 6px; }
    }

    /* ---- Statement table ---- */
    .stmt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      overflow-x: auto;
    }
    .stmt-title {
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--navy);
      border-bottom: 1px solid var(--border);
      background: #FAFBFC;
    }
    .stmt-table {
      width: 100%;
      min-width: 320px;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }
    .stmt-table col.col-label  { width: 56%; }
    .stmt-table col.col-month  { width: 22%; }
    .stmt-table col.col-ytd    { width: 22%; }
    .stmt-table td {
      padding: 6px 12px;
      border-bottom: 1px solid #F0F2F5;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stmt-table tr:last-child td { border-bottom: none; }

    /* Column headers */
    .stmt-table thead th {
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-2);
      text-align: right;
      border-bottom: 1px solid var(--border);
      background: #FAFBFC;
    }
    .stmt-table thead th:first-child { text-align: left; }

    /* Value columns */
    .col-month, .col-ytd {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .col-ytd {
      color: var(--text-2);
      background: #FAFBFC;
      border-left: 1px solid var(--border);
    }
    .row-total .col-ytd, .row-net-pos .col-ytd, .row-net-neg .col-ytd {
      background: inherit;
      color: inherit;
    }

    /* Section header rows */
    .row-section td {
      padding-top: 14px;
      padding-bottom: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
      background: #FAFBFC;
    }

    /* Total rows */
    .row-total td {
      font-weight: 700;
      color: var(--navy);
      border-top: 1px solid var(--border);
      border-bottom: 2px solid var(--navy);
      background: #F7F9FC;
    }

    /* Net income row — coloured */
    .row-net-pos td { font-weight: 700; color: var(--ok);     background: var(--ok-bg); }
    .row-net-neg td { font-weight: 700; color: var(--danger); background: var(--danger-bg); }

    /* Zero values muted */
    .val-zero { color: var(--text-3) !important; }

    /* Negative values */
    .val-neg { color: var(--danger); }

    /* ---- Empty / loading ---- */
    .fin-empty {
      text-align: center; padding: 60px 24px;
      color: var(--text-2); font-size: 14px;
    }
  </style>
