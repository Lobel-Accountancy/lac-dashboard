<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC Financials</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- Month tab bar ---- */
    .month-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .month-btn {
      padding: 6px 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .month-btn:hover  { border-color: var(--blue); color: var(--blue); }
    .month-btn.active { background: var(--navy); border-color: var(--navy); color: white; }

    /* ---- Statement grid ---- */
    .stmt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) { .stmt-grid { grid-template-columns: 1fr; } }

    @media (max-width: 600px) {
      .stmt-table { font-size: 11px; }
      .stmt-table td, .stmt-table thead th { padding: 5px 6px; }
    }

    /* ---- Statement table ---- */
    .stmt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      overflow-x: auto;
    }
    .stmt-title {
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--navy);
      border-bottom: 1px solid var(--border);
      background: #FAFBFC;
    }
    .stmt-table {
      width: 100%;
      min-width: 320px;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }
    .stmt-table col.col-label  { width: 56%; }
    .stmt-table col.col-month  { width: 22%; }
    .stmt-table col.col-ytd    { width: 22%; }
    .stmt-table td {
      padding: 6px 12px;
      border-bottom: 1px solid #F0F2F5;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stmt-table tr:last-child td { border-bottom: none; }

    /* Column headers */
    .stmt-table thead th {
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-2);
      text-align: right;
      border-bottom: 1px solid var(--border);
      background: #FAFBFC;
    }
    .stmt-table thead th:first-child { text-align: left; }
    .stmt-table thead th.col-month,
    .stmt-table thead th.col-ytd   { text-align: center; }

    /* Value columns */
    .col-month, .col-ytd {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .col-ytd {
      color: var(--text-2);
      background: #FAFBFC;
      border-left: 1px solid var(--border);
    }
    .row-total .col-ytd, .row-net-pos .col-ytd, .row-net-neg .col-ytd {
      background: inherit;
      color: inherit;
    }

    /* Section header rows */
    .row-section td {
      padding-top: 14px;
      padding-bottom: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
      background: #FAFBFC;
    }

    /* Total rows */
    .row-total td {
      font-weight: 700;
      color: var(--navy);
      border-top: 1px solid var(--border);
      border-bottom: 2px solid var(--navy);
      background: #F7F9FC;
    }

    /* Net income row — coloured */
    .row-net-pos td { font-weight: 700; color: var(--ok);     background: var(--ok-bg); }
    .row-net-neg td { font-weight: 700; color: var(--danger); background: var(--danger-bg); }

    /* Zero values muted */
    .val-zero { color: var(--text-3) !important; }

    /* Negative values */
    .val-neg { color: var(--danger); }

    /* ---- Empty / loading ---- */
    .fin-empty {
      text-align: center; padding: 60px 24px;
      color: var(--text-2); font-size: 14px;
    }


    /* ---- Drillable cells ---- */
    .val-drillable {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-color: rgba(37,99,235,.25);
      text-underline-offset: 3px;
    }
    .val-drillable:hover {
      background: rgba(37,99,235,.07);
      text-decoration-color: rgba(37,99,235,.7);
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A3F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<main class="main">
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;">
    <h2 style="font-size:22px;font-weight:600;color:var(--navy);">Financials</h2>
    <span style="font-size:12px;color:var(--text-3);">GAAP Basis · FY2026</span>
  </div>
  <div class="error-banner" id="error-banner" hidden></div>

  <div class="month-bar" id="month-bar"></div>

  <div id="fin-body">
    <div class="fin-empty">Loading…</div>
  </div>
</main>

<!-- GL hover tooltip -->
<div id="gl-tooltip" style="display:none;position:fixed;z-index:600;background:white;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.15);min-width:340px;max-width:420px;pointer-events:none;overflow:hidden;"></div>

<!-- Transaction drill-down modal -->
<div id="txn-overlay" onclick="if(event.target===this)closeTxnModal()"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:12px;width:720px;max-width:94vw;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.22);">
    <div style="padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;">
      <div>
        <div id="txn-title" style="font-size:15px;font-weight:700;color:var(--navy);"></div>
        <div id="txn-subtitle" style="font-size:12px;color:var(--text-2);margin-top:3px;"></div>
      </div>
      <button onclick="closeTxnModal()" style="background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--text-2);padding:0 0 0 16px;">×</button>
    </div>
    <div id="txn-body" style="overflow-y:auto;flex:1;"></div>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/palette.js"></script>
<script src="js/auth.js"></script>
<script src="js/financials.js"></script>
<script src="js/chat.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</div><!-- .page-body -->
</body>
</html>
