<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC Accounting</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- Section tabs ---- */
    .acct-tab-bar {
      display: flex;
      gap: 0;
      flex-wrap: wrap;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }
    .acct-tab-btn {
      padding: 10px 22px;
      border: none;
      background: none;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .acct-tab-btn:hover  { color: var(--navy); }
    .acct-tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 700; }

    /* ---- Cards ---- */
    .acct-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .acct-card-title {
      padding: 13px 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--navy);
      border-bottom: 1px solid var(--border);
      background: #FAFBFC;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .acct-card-body { padding: 0; overflow-x: auto; }

    /* ---- Tables ---- */
    .acct-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 400px;
    }
    .acct-table thead th {
      padding: 7px 14px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
      background: #FAFBFC;
      text-align: left;
      white-space: nowrap;
    }
    .acct-table thead th.num { text-align: right; }
    .acct-table tbody td {
      padding: 7px 14px;
      border-bottom: 1px solid #F0F2F5;
      color: var(--text);
      white-space: nowrap;
    }
    .acct-table tbody tr:last-child td { border-bottom: none; }
    .acct-table tbody tr:hover td { background: rgba(27,42,63,.035); }
    .acct-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .acct-table .row-total td {
      font-weight: 700;
      color: var(--navy);
      border-top: 1px solid var(--border);
      border-bottom: 2px solid var(--navy);
      background: #F7F9FC;
    }
    .acct-table .row-section td {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-2);
      background: #FAFBFC;
      padding-top: 12px;
      padding-bottom: 5px;
    }

    /* ---- Bank Recon ---- */
    .bank-period {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    .bank-period:last-child { border-bottom: none; }
    .bank-period-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bank-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .bank-badge.ok  { background: var(--ok-bg);     color: var(--ok); }
    .bank-badge.err { background: var(--danger-bg);  color: var(--danger); }
    .bank-recon-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      max-width: 420px;
    }
    .bank-recon-table td { padding: 5px 0; vertical-align: top; }
    .bank-recon-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; padding-left: 24px; }
    .bank-recon-table .hr td { border-top: 1px solid var(--border); padding-top: 8px; font-weight: 700; color: var(--navy); }
    .bank-recon-table .section-lbl td { color: var(--text-2); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding-top: 12px; padding-bottom: 3px; }
    .bank-recon-table .cat-row td:first-child { padding-left: 16px; color: var(--text-2); }
    .bank-meta { font-size: 12px; color: var(--text-3); margin-bottom: 16px; }

    /* ---- Equity rollforward ---- */
    .equity-stmt {
      padding: 20px 24px;
    }
    .equity-table {
      width: 100%;
      max-width: 480px;
      border-collapse: collapse;
      font-size: 13px;
    }
    .equity-table td { padding: 6px 0; }
    .equity-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; min-width: 120px; padding-left: 24px; }
    .equity-table .eq-section td { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); padding-top: 14px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .equity-table .eq-indent td:first-child { padding-left: 20px; }
    .equity-table .eq-total td { font-weight: 700; color: var(--navy); border-top: 1px solid var(--border); padding-top: 8px; }
    .equity-table .eq-ending td { font-weight: 700; font-size: 14px; color: var(--navy); border-top: 2px solid var(--navy); padding-top: 10px; }
    .equity-table .eq-check td { font-size: 11px; color: var(--ok); }

    .equity-monthly { margin-top: 24px; }
    .equity-monthly-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin-bottom: 10px; }

    /* ---- Tab sections ---- */
    .acct-section { display: none; }
    .acct-section.active { display: block; }

    /* ---- Empty state ---- */
    .acct-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-2);
      font-size: 13px;
    }

    /* ---- Two-column grid for assets ---- */
    .asset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) { .asset-grid { grid-template-columns: 1fr; } }

    .val-zero { color: var(--text-3) !important; }
    .val-neg  { color: var(--danger) !important; }
    .val-pos  { color: var(--ok) !important; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A3F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<main class="main">

  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;">
    <h2 style="font-size:22px;font-weight:600;color:var(--navy);">Accounting</h2>
    <span style="font-size:12px;color:var(--text-3);">Read-only · FY2026</span>
  </div>
  <div class="error-banner" id="error-banner" hidden></div>

  <div class="acct-tab-bar">
    <button class="acct-tab-btn active" data-tab="bank"        onclick="switchTab(this,'bank')">Bank Reconciliation</button>
    <button class="acct-tab-btn"        data-tab="fixed"       onclick="switchTab(this,'fixed')">Fixed Assets</button>
    <button class="acct-tab-btn"        data-tab="prepaid"     onclick="switchTab(this,'prepaid')">Prepaid Expenses</button>
    <button class="acct-tab-btn"        data-tab="reimb"       onclick="switchTab(this,'reimb')">Shareholder Reimb.</button>
    <button class="acct-tab-btn"        data-tab="equity"      onclick="switchTab(this,'equity')">Equity Rollforward</button>
  </div>

  <!-- Bank Reconciliation -->
  <div id="tab-bank" class="acct-section active">
    <div id="bank-body"><div class="acct-empty">Loading…</div></div>
  </div>

  <!-- Fixed Assets -->
  <div id="tab-fixed" class="acct-section">
    <div id="fixed-body"><div class="acct-empty">Loading…</div></div>
  </div>

  <!-- Prepaid Expenses -->
  <div id="tab-prepaid" class="acct-section">
    <div id="prepaid-body"><div class="acct-empty">Loading…</div></div>
  </div>

  <!-- Shareholder Reimbursements -->
  <div id="tab-reimb" class="acct-section">
    <div id="reimb-body"><div class="acct-empty">Loading…</div></div>
  </div>

  <!-- Equity Rollforward -->
  <div id="tab-equity" class="acct-section">
    <div id="equity-body"><div class="acct-empty">Loading…</div></div>
  </div>

</main>

<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/palette.js"></script>
<script src="js/auth.js"></script>
<script src="js/accounting.js"></script>
<script src="js/chat.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</div>
</body>
</html>
