<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC Signatures</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.has-sidebar { height: 100vh; overflow: hidden; }
    .page-body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .main { padding: 0; flex: 1; overflow: hidden; position: relative; }
    .sign-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .sign-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text-3);
      font-size: 14px;
      pointer-events: none;
      transition: opacity .3s;
    }
    .sign-loading.hidden { opacity: 0; }
    @media (max-width: 768px) {
      .main { padding-top: 56px; }
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A3F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<div class="sign-loading" id="sign-loading">Loading Signatures…</div>
<main class="main">
  <iframe
    class="sign-frame"
    id="sign-frame"
    src="https://sign.lobelaccountancy.com"
    title="LAC Signatures"
  ></iframe>
</main>
</div>

<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/palette.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;
    document.getElementById('sign-frame').addEventListener('load', () => {
      document.getElementById('sign-loading').classList.add('hidden');
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
