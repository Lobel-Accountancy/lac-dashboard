<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Chase — LAC</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           margin: 0; background: #F7F8FA; }
    .nav { background: #1B2A4A; padding: 0 24px; height: 52px;
           display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { height: 32px; width: 32px; border-radius: 4px; display: block; }
    .nav-link { color: rgba(255,255,255,.75); text-decoration: none; font-size: 13px; margin-left: 16px; }
    .nav-link:hover { color: white; }
    .main { padding: 40px 24px; }
    .link-card { max-width: 480px; margin: 60px auto; background: white;
      border: 1px solid #E2E8F0; border-radius: 12px; padding: 40px; text-align: center; }
    .link-title { font-size: 20px; font-weight: 700; color: #1B2A4A; margin-bottom: 8px; }
    .link-sub { font-size: 14px; color: #64748B; margin-bottom: 32px; line-height: 1.6; }
    .btn-connect { display: block; width: 100%; padding: 13px 32px;
      background: #1B2A4A; color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer; box-sizing: border-box; }
    .btn-connect:hover { background: #1a2a4a; }
    .btn-connect:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-top: 20px; font-size: 14px; color: #64748B; min-height: 20px; }
    .status.ok  { color: #1A7A4A; font-weight: 600; }
    .status.err { color: #C0392B; }
  </style>
</head>
<body>
<nav class="nav">
  <img class="nav-brand" src="favicon.jpg" alt="Lobel Accountancy">
  <div>
    <a class="nav-link" href="index.html">← Dashboard</a>
  </div>
</nav>

<div class="main">
  <div class="link-card">
    <div class="link-title">Connect Chase Business Account</div>
    <div class="link-sub">
      Securely link your Chase Operating account via Plaid.<br>
      Transactions will sync nightly to the LAC Workbook.
    </div>
    <button class="btn-connect" id="connect-btn">Connect Chase Account</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
const AUTH_URL = 'https://auth.lobelaccountancy.com';
const btn      = document.getElementById('connect-btn');
const statusEl = document.getElementById('status');

function getJWT() {
  return localStorage.getItem('lac_jwt') || sessionStorage.getItem('lac_jwt') || '';
}

btn.addEventListener('click', startLink);

// Resume OAuth flow if returning from Chase redirect
const params = new URLSearchParams(window.location.search);
if (params.get('oauth_state_id')) {
  const saved = sessionStorage.getItem('plaid_link_token');
  if (saved) openPlaidLink(saved);
}

async function startLink() {
  const jwt = getJWT();
  if (!jwt) {
    statusEl.textContent = 'You must be signed in. Go to the dashboard first.';
    statusEl.className = 'status err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Loading…';
  statusEl.textContent = '';
  statusEl.className = 'status';

  try {
    const res  = await fetch(`${AUTH_URL}/plaid/link-token`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${jwt}` },
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.error || `Error ${res.status}`);
      return;
    }
    sessionStorage.setItem('plaid_link_token', data.link_token);
    openPlaidLink(data.link_token);
  } catch (e) {
    showError('Network error — ' + e.message);
  }
}

function openPlaidLink(linkToken) {
  const handler = Plaid.create({
    token: linkToken,
    onSuccess: async (publicToken) => {
      statusEl.textContent = 'Saving connection…';
      statusEl.className = 'status';
      const jwt = getJWT();
      try {
        const res  = await fetch(`${AUTH_URL}/plaid/exchange`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${jwt}` },
          body: JSON.stringify({ public_token: publicToken }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          statusEl.textContent = '✓ Chase account connected. Transactions will sync tonight at 1:30am.';
          statusEl.className = 'status ok';
          btn.textContent = 'Connected';
        } else {
          showError(data.error || 'Exchange failed');
        }
      } catch (e) {
        showError('Network error — ' + e.message);
      }
    },
    onExit: (err) => {
      btn.disabled = false;
      btn.textContent = 'Connect Chase Account';
      if (err) showError(err.display_message || 'Cancelled');
    },
    receivedRedirectUri: params.get('oauth_state_id') ? window.location.href : undefined,
  });
  handler.open();
}

function showError(msg) {
  statusEl.textContent = msg;
  statusEl.className = 'status err';
  btn.disabled = false;
  btn.textContent = 'Connect Chase Account';
}
</script>
</body>
</html>
