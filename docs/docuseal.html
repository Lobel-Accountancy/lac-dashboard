<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC DocuSeal</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .launch-card {
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
      padding: 40px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .launch-card h2 { font-size: 22px; margin: 0 0 8px; color: var(--navy); }
    .launch-card p  { font-size: 14px; color: var(--text-2); margin: 0 0 28px; }
    .btn-launch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
    }
    .btn-launch:hover { background: #2a3d5c; }
    .launch-note { margin-top: 16px; font-size: 12px; color: var(--text-3); }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A3F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<main class="main">
  <div class="launch-card">
    <h2>DocuSeal</h2>
    <p>E-signature and document management. Opens in a new tab.</p>
    <a class="btn-launch" href="https://sign.lobelaccountancy.com" target="_blank" rel="noopener">
      Open DocuSeal ↗
    </a>
    <div class="launch-note">sign.lobelaccountancy.com</div>
  </div>
</main>

<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/palette.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;
    const payload = jwtPayload(getJWT());
    document.getElementById('nav-user').textContent = (payload?.email || '').split('@')[0];
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</div><!-- .page-body -->
</body>
</html>
