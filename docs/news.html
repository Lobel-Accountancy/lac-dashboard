<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC Accounting News</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Full-page: override max-width for this tab only */
    .main { max-width: none; padding: 24px 28px 48px; }

    /* ── Top bar ─────────────────────────────────────────────────────── */
    .news-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .filter-chip {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-2);
      transition: background .12s, color .12s, border-color .12s;
      white-space: nowrap;
    }
    .filter-chip.active { color: #fff; border-color: transparent; }
    .refresh-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 5px 13px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
    }
    .refresh-btn:hover { border-color: var(--accent-teal); color: var(--text); }
    .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Hero card (top story) ────────────────────────────────────────── */
    .news-hero {
      display: grid;
      grid-template-columns: 42% 1fr;
      min-height: 300px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      text-decoration: none;
      color: var(--text);
      transition: box-shadow .18s, transform .18s;
    }
    .news-hero:hover { box-shadow: 0 10px 40px rgba(0,0,0,.35); transform: translateY(-2px); }
    .news-hero-img {
      overflow: hidden;
      position: relative;
    }
    .news-hero-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .news-hero-img.fallback {
      display: flex; align-items: center; justify-content: center;
      font-size: 56px; font-weight: 900; color: rgba(255,255,255,.25);
      letter-spacing: -2px;
    }
    .news-hero-body {
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }
    .source-badge {
      display: inline-block;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; padding: 3px 10px; border-radius: 20px;
      color: #fff; width: fit-content; margin-bottom: 12px;
    }
    .news-hero-title {
      font-size: 24px; font-weight: 700; line-height: 1.3;
      color: var(--text); margin-bottom: 14px;
    }
    .news-hero-summary {
      font-size: 14px; color: var(--text-2); line-height: 1.65;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 16px;
    }
    .news-meta {
      font-size: 11px; color: var(--text-3);
    }
    .news-read-more {
      margin-top: 18px;
      font-size: 12px; font-weight: 600;
      color: var(--accent-teal, #2ab8a0);
    }

    /* No-hero fallback (no images at all on top story) */
    .news-hero.no-image {
      grid-template-columns: 1fr;
    }
    .news-hero.no-image .news-hero-img { display: none; }
    .news-hero.no-image .news-hero-body { padding: 36px 40px; }
    .news-hero.no-image .news-hero-title { font-size: 28px; }

    /* ── Tile grid ────────────────────────────────────────────────────── */
    .news-tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 1200px) { .news-tiles { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 800px)  {
      .news-tiles { grid-template-columns: repeat(2, 1fr); }
      .news-hero  { grid-template-columns: 1fr; min-height: auto; }
      .news-hero-img { height: 180px; }
    }
    @media (max-width: 500px)  {
      .news-tiles { grid-template-columns: 1fr; }
      .news-hero-img { height: 140px; }
    }

    .news-tile {
      display: flex; flex-direction: column;
      border-radius: 10px; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-decoration: none; color: var(--text);
      transition: transform .15s, box-shadow .15s;
    }
    .news-tile:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(0,0,0,.28); }

    .tile-img {
      height: 150px; overflow: hidden; flex-shrink: 0; position: relative;
    }
    .tile-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .3s;
    }
    .news-tile:hover .tile-img img { transform: scale(1.04); }
    .tile-img.fallback {
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900; color: rgba(255,255,255,.22);
    }

    .tile-body {
      padding: 14px 16px;
      flex: 1; display: flex; flex-direction: column;
    }
    .tile-title {
      font-size: 13px; font-weight: 600; line-height: 1.45;
      margin-bottom: 7px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-summary {
      font-size: 11.5px; color: var(--text-2); line-height: 1.55; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-footer {
      margin-top: 10px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10.5px; color: var(--text-3);
    }

    /* ── Skeleton & empty states ─────────────────────────────────────── */
    .news-skeleton-hero {
      height: 300px; border-radius: 12px; background: var(--surface);
      border: 1px solid var(--border); margin-bottom: 20px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .news-skeleton-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    }
    .news-skeleton-tile {
      height: 220px; border-radius: 10px; background: var(--surface);
      border: 1px solid var(--border); animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: .45; }
    }
    .news-empty {
      padding: 60px 20px; text-align: center;
      color: var(--text-2); font-size: 14px;
    }
    .news-error {
      padding: 24px; color: var(--danger, #e05555); font-size: 13px;
    }

    /* ── FASB ASU section ────────────────────────────────────────────── */
    .fasb-section {
      margin-bottom: 28px;
    }
    .fasb-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .fasb-section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-2);
    }
    .fasb-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(27,42,63,.1);
      color: #1B2A3F;
      border: 1px solid rgba(27,42,63,.25);
    }
    .fasb-powered {
      font-size: 9px;
      color: var(--text-3);
      margin-left: auto;
    }
    .fasb-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .fasb-scroll::-webkit-scrollbar { height: 4px; }
    .fasb-scroll::-webkit-scrollbar-track { background: transparent; }
    .fasb-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .fasb-card {
      flex-shrink: 0;
      width: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      transition: box-shadow .15s, transform .15s;
      border-top: 3px solid #1B2A3F;
    }
    .fasb-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    .fasb-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .fasb-number {
      font-size: 14px;
      font-weight: 700;
      font-family: monospace;
      color: #1B2A3F;
    }
    .fasb-status {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .fasb-status-new         { background: rgba(26,122,74,.12);  color: #1A7A4A; border: 1px solid rgba(26,122,74,.25); }
    .fasb-status-amended     { background: rgba(180,83,9,.12);   color: #B45309; border: 1px solid rgba(180,83,9,.25); }
    .fasb-status-clarification { background: rgba(46,109,164,.12); color: #2E6DA4; border: 1px solid rgba(46,109,164,.25); }
    .fasb-status-simplification { background: rgba(99,102,241,.12); color: #6366F1; border: 1px solid rgba(99,102,241,.25); }
    .fasb-topic {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .fasb-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .fasb-summary {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }
    .fasb-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
    }
    .fasb-date {
      font-size: 10px;
      color: var(--text-3);
    }
    .fasb-effective {
      font-size: 10px;
      color: var(--text-3);
      padding: 1px 6px;
      background: rgba(0,0,0,.04);
      border-radius: 4px;
    }
    .fasb-early {
      font-size: 9px;
      font-weight: 700;
      color: #1A7A4A;
      padding: 1px 6px;
      background: rgba(26,122,74,.08);
      border-radius: 4px;
      border: 1px solid rgba(26,122,74,.2);
    }
    .fasb-skeleton {
      flex-shrink: 0; width: 280px; height: 200px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; animation: pulse 1.4s ease-in-out infinite;
    }
  </style>
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<main class="main">
  <div class="greeting">Accounting News</div>
  <div class="date-line" id="date-line"></div>

  <div class="error-banner" id="error-banner" hidden></div>

  <div class="news-topbar" id="news-topbar">
    <button class="filter-chip active" data-source="all" onclick="setFilter('all',this)">All Sources</button>
    <button class="refresh-btn" id="refresh-btn" onclick="loadNews()">↻ Refresh</button>
  </div>

  <!-- FASB ASU section — loaded independently -->
  <div class="fasb-section" id="fasb-section">
    <div class="fasb-section-header">
      <span class="fasb-section-title">FASB Standards Updates</span>
      <span class="fasb-badge">ASUs</span>
      <span class="fasb-powered">Powered by Gemini 2.5</span>
    </div>
    <div class="fasb-scroll" id="fasb-scroll">
      <div class="fasb-skeleton"></div>
      <div class="fasb-skeleton"></div>
      <div class="fasb-skeleton"></div>
      <div class="fasb-skeleton"></div>
      <div class="fasb-skeleton"></div>
    </div>
  </div>

  <div id="news-wrap">
    <div class="news-skeleton-hero"></div>
    <div class="news-skeleton-grid">
      <div class="news-skeleton-tile"></div>
      <div class="news-skeleton-tile"></div>
      <div class="news-skeleton-tile"></div>
      <div class="news-skeleton-tile"></div>
    </div>
  </div>
</main>

<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/palette.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('date-line').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  const SOURCE_COLORS = {
    'Journal of Accountancy': '#1B2A3F',
    'Going Concern':          '#B45309',
    'CPA Practice Advisor':   '#7C3AED',
    'Tax Foundation':         '#0369A1',
    'The CPA Journal':        '#0E7490',
    'Thomson Reuters Tax':    '#D97706',
    'CPA Trendlines':         '#0F766E',
    'Intuit TaxPro Center':   '#2563EB',
    'CFO Dive':               '#4F46E5',
    'Compliance Week':        '#DC2626',
  };
  const DEFAULT_COLOR = '#4A5568';

  let _allItems    = [];
  let _activeFilter = 'all';

  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    loadFasbAsus();
    loadNews();
  });

  async function loadFasbAsus() {
    try {
      const data = await apiFetch('/data/fasb-asus');
      renderFasbAsus(data.asus || []);
    } catch (err) {
      document.getElementById('fasb-scroll').innerHTML =
        `<div style="padding:16px;color:var(--text-3);font-size:12px;">Could not load ASUs: ${esc(err.message)}</div>`;
    }
  }

  function renderFasbAsus(asus) {
    const scroll = document.getElementById('fasb-scroll');
    if (!asus.length) {
      scroll.innerHTML = '<div style="padding:16px;color:var(--text-3);font-size:12px;">No ASU data available.</div>';
      return;
    }
    scroll.innerHTML = asus.map(a => {
      const statusClass = {
        'New Standard':     'fasb-status-new',
        'Amended':          'fasb-status-amended',
        'Clarification':    'fasb-status-clarification',
        'Simplification':   'fasb-status-simplification',
      }[a.status] || 'fasb-status-new';
      return `
        <a class="fasb-card" href="${esc(a.url || 'https://www.fasb.org/standards/accounting-standards-updates')}" target="_blank" rel="noopener">
          <div class="fasb-card-top">
            <span class="fasb-number">${esc(a.number)}</span>
            <span class="fasb-status ${statusClass}">${esc(a.status)}</span>
          </div>
          ${a.topic ? `<div class="fasb-topic">${esc(a.topic)}</div>` : ''}
          <div class="fasb-title">${esc(a.title)}</div>
          ${a.summary ? `<div class="fasb-summary">${esc(a.summary)}</div>` : ''}
          <div class="fasb-meta">
            ${a.issue_date ? `<span class="fasb-date">Issued ${esc(a.issue_date)}</span>` : ''}
            ${a.effective_date ? `<span class="fasb-effective">Effective: ${esc(a.effective_date)}</span>` : ''}
            ${a.early_adopt ? `<span class="fasb-early">Early Adopt ✓</span>` : ''}
          </div>
        </a>`;
    }).join('');
  }

  async function loadNews() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    btn.textContent = '↻ Loading…';
    try {
      const data = await apiFetch('/data/news');
      _allItems = (data.items || []);
      buildFilters(_allItems);
      renderNews(_allItems, _activeFilter);
    } catch (err) {
      document.getElementById('news-wrap').innerHTML =
        `<div class="news-error">Could not load news: ${esc(err.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = '↻ Refresh';
    }
  }

  function buildFilters(items) {
    const sources = [...new Set(items.map(i => i.source))];
    const topbar  = document.getElementById('news-topbar');
    const refreshBtn = document.getElementById('refresh-btn');

    // Rebuild filter chips, keep refresh button at end
    topbar.innerHTML = '';
    const allChip = chip('all', 'All Sources');
    topbar.appendChild(allChip);
    sources.forEach(src => topbar.appendChild(chip(src, src)));
    topbar.appendChild(refreshBtn);
  }

  function chip(src, label) {
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (src === _activeFilter ? ' active' : '');
    btn.dataset.source = src;
    btn.textContent = label;
    const color = SOURCE_COLORS[src] || DEFAULT_COLOR;
    if (src === _activeFilter) {
      btn.style.background = color;
      btn.style.borderColor = color;
    }
    btn.onclick = () => setFilter(src, btn);
    return btn;
  }

  function setFilter(source, clicked) {
    _activeFilter = source;
    document.querySelectorAll('.filter-chip').forEach(c => {
      const s = c.dataset.source;
      const color = SOURCE_COLORS[s] || DEFAULT_COLOR;
      const on = s === source;
      c.classList.toggle('active', on);
      c.style.background  = on ? color : '';
      c.style.borderColor = on ? color : '';
    });
    renderNews(_allItems, source);
  }

  function renderNews(items, filter) {
    const list  = filter === 'all' ? items : items.filter(i => i.source === filter);
    const wrap  = document.getElementById('news-wrap');

    if (!list.length) {
      wrap.innerHTML = '<div class="news-empty">No articles loaded.</div>';
      return;
    }

    const [hero, ...rest] = list;
    wrap.innerHTML = heroHtml(hero) + (rest.length ? `<div class="news-tiles">${rest.map(tileHtml).join('')}</div>` : '');
  }

  function heroHtml(item) {
    const color = SOURCE_COLORS[item.source] || DEFAULT_COLOR;
    const imgEl = item.image
      ? `<img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.closest('.news-hero-img').classList.add('fallback');this.remove();">`
      : '';
    const noImg = !item.image ? ' no-image' : '';
    const initials = acronym(item.source);

    return `
      <a class="news-hero${noImg}" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">
        <div class="news-hero-img fallback" style="background:linear-gradient(135deg,${color}cc,${color}55);">
          ${imgEl || `<span>${initials}</span>`}
        </div>
        <div class="news-hero-body">
          <span class="source-badge" style="background:${color};">${esc(item.source)}</span>
          <div class="news-hero-title">${esc(item.title)}</div>
          ${item.summary ? `<div class="news-hero-summary">${esc(item.summary)}</div>` : ''}
          <div class="news-meta">${esc(item.date)}</div>
          <div class="news-read-more">Read article →</div>
        </div>
      </a>`;
  }

  function tileHtml(item) {
    const color = SOURCE_COLORS[item.source] || DEFAULT_COLOR;
    const initials = acronym(item.source);
    const imgSection = item.image
      ? `<div class="tile-img"><img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.closest('.tile-img').classList.add('fallback');this.closest('.tile-img').innerHTML='<span>${initials}</span>';"></div>`
      : `<div class="tile-img fallback" style="background:linear-gradient(135deg,${color}cc,${color}44);"><span>${initials}</span></div>`;

    return `
      <a class="news-tile" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">
        ${imgSection}
        <div class="tile-body">
          <span class="source-badge" style="background:${color};">${esc(item.source)}</span>
          <div class="tile-title">${esc(item.title)}</div>
          ${item.summary ? `<div class="tile-summary">${esc(item.summary)}</div>` : ''}
          <div class="tile-footer">
            <span>${esc(item.date)}</span>
          </div>
        </div>
      </a>`;
  }

  function acronym(str) {
    return (str || '').split(/\s+/).map(w => w[0]).join('').substring(0, 3).toUpperCase();
  }

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
<script src="js/chat.js"></script>
</div>
</body>
</html>
