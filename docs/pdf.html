<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC PDF Tools</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html { height: 100%; overflow: hidden; }
    .main { padding: 0; height: calc(100vh - 52px); }
    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .pdf-loading {
      position: absolute;
      top: 52px; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text-3);
      font-size: 14px;
      pointer-events: none;
      transition: opacity .3s;
    }
    .pdf-loading.hidden { opacity: 0; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A3F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<div class="pdf-loading" id="pdf-loading">Loading PDF Tools…</div>
<main class="main">
  <iframe
    class="pdf-frame"
    id="pdf-frame"
    src="https://pdf.lobelaccountancy.com"
    title="LAC PDF Tools"
  ></iframe>
</main>

<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/palette.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;
    const payload = jwtPayload(getJWT());
    document.getElementById('nav-user').textContent = (payload?.email || '').split('@')[0];
    document.getElementById('pdf-frame').addEventListener('load', () => {
      document.getElementById('pdf-loading').classList.add('hidden');
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</div><!-- .page-body -->
</body>
</html>
