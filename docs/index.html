<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC Morning Briefing</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A3F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<main class="main">
  <div class="greeting" id="greeting"></div>
  <div class="date-line" id="date-line"></div>

  <div class="error-banner" id="error-banner" hidden></div>

  <!-- KPI row + Recent Journal Entries side by side -->
  <div class="kpi-je-wrap">
    <div class="kpi-grid" id="kpi-grid" style="display:contents;">
      <div class="kpi-card"><span class="kpi-skeleton-label"></span><span class="kpi-skeleton-value"></span><span class="kpi-skeleton-sub"></span></div>
      <div class="kpi-card"><span class="kpi-skeleton-label"></span><span class="kpi-skeleton-value"></span><span class="kpi-skeleton-sub"></span></div>
      <div class="kpi-card"><span class="kpi-skeleton-label"></span><span class="kpi-skeleton-value"></span><span class="kpi-skeleton-sub"></span></div>
      <div class="kpi-card"><span class="kpi-skeleton-label"></span><span class="kpi-skeleton-value"></span><span class="kpi-skeleton-sub"></span></div>
    </div>
    <div class="card" id="recent-je-card" style="grid-column:2/span 2;grid-row:2;margin:0;">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Recent Journal Entries</span>
        <a href="journal.html" style="font-size:12px;font-weight:400;color:var(--accent-teal,#2ab8a0);text-decoration:none;">View all →</a>
      </div>
      <div class="card-body" id="recent-je-body"><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--med"></div><div class="skeleton-line skeleton-line--full"></div></div>
    </div>
  </div>

  <!-- Content: AR + Deadlines side by side -->
  <div class="content-grid">
    <div class="card">
      <div class="card-header">Overdue Invoices</div>
      <div class="card-body" id="ar-body"><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--med"></div><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--short"></div></div>
    </div>
    <div class="card">
      <div class="card-header">Upcoming Deadlines <span style="font-weight:400;color:#8BA7C4;font-size:12px;">next 30 days</span></div>
      <div class="card-body" id="deadlines-body"><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--med"></div><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--short"></div></div>
    </div>
  </div>

  <!-- Compliance Dates + Calendar -->
  <div class="content-grid">
    <div class="card">
      <div class="card-header">Key Compliance Dates <span style="font-weight:400;color:#8BA7C4;font-size:12px;">overdue &amp; next 90 days</span></div>
      <div class="card-body" id="compliance-body"><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--med"></div><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--short"></div></div>
    </div>
    <div class="card">
      <div class="card-header">Upcoming Calendar Events <span style="font-weight:400;color:#8BA7C4;font-size:12px;">next 14 days</span></div>
      <div class="card-body" id="calendar-body"><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--med"></div><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--short"></div></div>
    </div>
  </div>

  <!-- Charts row -->
  <div class="content-grid" style="grid-template-columns:1fr 1fr;align-items:start;">
    <div class="card">
      <div class="card-header">Pipeline by Stage</div>
      <div class="card-body" id="pipeline-body" style="padding:16px 20px;">
        <canvas id="pipeline-chart" height="160"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="card-header">AR Aging Mix</div>
      <div class="card-body" id="ar-donut-body" style="padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:24px;">
        <canvas id="ar-donut-chart" width="160" height="160" style="flex-shrink:0;"></canvas>
        <div id="ar-donut-legend" style="font-size:12px;line-height:1.8;"></div>
      </div>
    </div>
  </div>

  <!-- Regulatory Updates -->
  <div class="card card--full">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Regulatory Updates</span>
      <span id="reg-digest-label" style="font-size:11px;font-weight:400;opacity:.7;"></span>
    </div>
    <div class="card-body" id="reg-body"><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--med"></div><div class="skeleton-line skeleton-line--full"></div><div class="skeleton-line skeleton-line--short"></div></div>
  </div>

  <div class="refresh-bar">
    <span class="refresh-dot" id="refresh-dot"></span>
    <span id="refresh-status"></span>
    <button class="btn-refresh" onclick="loadBriefing()" title="Refresh now">↻</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/palette.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/card-resize.js"></script>
<script>
  // Set the date line once (no need to wait for data)
  document.getElementById('date-line').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
</script>
<script src="js/chat.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</div><!-- .page-body -->
</body>
</html>
