<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC Cron Monitor</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cron-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }
    .cron-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border-left: 4px solid var(--ok);
    }
    .cron-card--error   { border-left-color: var(--danger); }
    .cron-card--warning { border-left-color: var(--warning); }
    .cron-card--unknown { border-left-color: var(--border); }
    .cron-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--border);
    }
    .cron-name { font-weight: 600; font-size: 13px; color: var(--text); }
    .cron-status {
      font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 8px;
    }
    .cron-status--ok      { background: var(--ok-bg);      color: var(--ok); }
    .cron-status--error   { background: var(--danger-bg);  color: var(--danger); }
    .cron-status--unknown { background: var(--muted-bg);   color: var(--text-3); }
    .cron-card-meta {
      padding: 10px 16px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .cron-meta-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing:.04em; font-weight:600; }
    .cron-meta-value { font-size: 12px; color: var(--text); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .cron-log {
      padding: 0 16px 12px;
    }
    .cron-log-pre {
      background: var(--muted-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
      margin: 0;
    }
    .refresh-btn {
      background: var(--muted-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
      transition: background .15s;
    }
    .refresh-btn:hover { background: var(--border); color: var(--text); }
    .controls-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .last-checked { font-size: 12px; color: var(--text-3); }
    @media (max-width: 768px) { .cron-grid { grid-template-columns: 1fr; } }

    .cron-run-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-2);
      font-size: 11px;
      padding: 3px 9px;
      cursor: pointer;
      transition: all .12s;
      white-space: nowrap;
    }
    .cron-run-btn:hover { border-color: var(--ok); color: var(--ok); }
    .cron-run-btn:disabled { opacity: .5; cursor: not-allowed; }
    .cron-log-footer {
      padding: 6px 16px 10px;
      display: flex;
      justify-content: flex-end;
    }
    .cron-full-log-btn {
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 11px;
      cursor: pointer;
      padding: 2px 0;
      transition: color .1s;
    }
    .cron-full-log-btn:hover { color: var(--text); }

    /* Log modal */
    .log-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .log-modal-overlay.open { display: flex; }
    .log-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: min(900px, 95vw);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .log-modal-header {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .log-modal-title { font-weight: 700; font-size: 13px; color: var(--text); }
    .log-modal-meta  { font-size: 11px; color: var(--text-3); }
    .log-modal-close {
      background: none; border: none;
      color: var(--text-3); font-size: 20px;
      cursor: pointer; line-height: 1; padding: 0 2px;
    }
    .log-modal-close:hover { color: var(--text); }
    .log-modal-pre {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      font-family: 'SF Mono','Fira Code',monospace;
      font-size: 11px;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--bg, #111);
      margin: 0;
      line-height: 1.55;
    }
  </style>
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<main class="main">
  <div class="greeting">Cron Monitor</div>
  <div class="date-line" id="date-line"></div>
  <div class="error-banner" id="error-banner" hidden></div>

  <div class="controls-bar">
    <span class="last-checked" id="last-checked"></span>
    <button class="refresh-btn" id="btn-refresh">↻ Refresh</button>
  </div>

  <!-- Full log modal -->
  <div class="log-modal-overlay" id="log-modal" onclick="closeLogModal(event)">
    <div class="log-modal">
      <div class="log-modal-header">
        <span class="log-modal-title" id="log-modal-title"></span>
        <div style="display:flex;align-items:center;gap:14px;">
          <span class="log-modal-meta" id="log-modal-meta"></span>
          <button class="log-modal-close" onclick="closeLogModal()">×</button>
        </div>
      </div>
      <pre class="log-modal-pre" id="log-modal-pre">Loading…</pre>
    </div>
  </div>

  <div class="cron-grid" id="cron-grid">
    <div class="skeleton-block"></div>
    <div class="skeleton-block"></div>
    <div class="skeleton-block"></div>
    <div class="skeleton-block"></div>
    <div class="skeleton-block"></div>
    <div class="skeleton-block"></div>
  </div>

  <!-- Admin Actions -->
  <div style="margin-top:28px;">
    <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px;">Admin Actions</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;">
      <button id="btn-wb-reload" onclick="reloadWorkbook()"
        style="padding:8px 18px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;">
        ↺ Reload Workbook Cache
      </button>
    </div>
    <div id="wb-reload-status" style="margin-top:8px;font-size:12px;color:var(--text-3);"></div>
  </div>
</main>
</div><!-- .page-body -->

<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/palette.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!requireAuth()) return;
  const payload = jwtPayload(getJWT());
  document.getElementById('nav-user').textContent = (payload?.email || '').split('@')[0];
  document.getElementById('date-line').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  loadCron();
  document.getElementById('btn-refresh').addEventListener('click', loadCron);

  async function loadCron() {
    document.getElementById('last-checked').textContent = '';
    try {
      const data = await apiFetch('/cron/status');
      render(data.jobs || []);
      document.getElementById('last-checked').textContent =
        'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (err) {
      document.getElementById('error-banner').textContent = err.message;
      document.getElementById('error-banner').hidden = false;
    }
  }

  function render(jobs) {
    const grid = document.getElementById('cron-grid');
    if (!jobs.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--text-3);">No cron jobs found.</div>';
      return;
    }
    grid.innerHTML = jobs.map(j => {
      const statusClass = j.status === 'ok' ? '' : j.status === 'error' ? 'cron-card--error' : 'cron-card--unknown';
      const badgeClass  = j.status === 'ok' ? 'cron-status--ok' : j.status === 'error' ? 'cron-status--error' : 'cron-status--unknown';
      const statusLabel = j.status === 'ok' ? 'OK' : j.status === 'error' ? 'Error' : 'Unknown';
      const lastRun     = j.last_run ? new Date(j.last_run).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : 'Never';
      const logHtml = j.last_lines
        ? `<div class="cron-log"><pre class="cron-log-pre">${escHtml(j.last_lines)}</pre></div>`
        : '';
      const s = escHtml(j.script);
      const n = escHtml(j.name);
      return `
        <div class="cron-card ${statusClass}">
          <div class="cron-card-header">
            <span class="cron-name">${n}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <button class="cron-run-btn" id="run-${s}" onclick="runJob('${s}','${n}')">▶ Run</button>
              <span class="cron-status ${badgeClass}">${statusLabel}</span>
            </div>
          </div>
          <div class="cron-card-meta">
            <div>
              <div class="cron-meta-label">Schedule</div>
              <div class="cron-meta-value">${escHtml(j.schedule || '—')}</div>
            </div>
            <div>
              <div class="cron-meta-label">Last Run</div>
              <div class="cron-meta-value">${lastRun}</div>
            </div>
            <div>
              <div class="cron-meta-label">Exit Code</div>
              <div class="cron-meta-value">${j.exit_code !== null && j.exit_code !== undefined ? j.exit_code : '—'}</div>
            </div>
            <div>
              <div class="cron-meta-label">Log File</div>
              <div class="cron-meta-value" title="${escHtml(j.log_file || '')}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                ${j.log_file ? j.log_file.split('/').pop() : '—'}
              </div>
            </div>
          </div>
          ${logHtml}
          <div class="cron-log-footer">
            <button class="cron-full-log-btn" onclick="viewLog('${s}','${n}')">Full Log →</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function runJob(script, name) {
    if (!confirm(`Run "${name}" now?`)) return;
    const btn = document.getElementById(`run-${script}`);
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    try {
      await apiFetch('/cron/run', {
        method: 'POST',
        body: JSON.stringify({ script }),
      });
      showToast(`${name} started — refresh in ~30s to see updated log`, 'success');
    } catch (err) {
      showToast(`Failed: ${err.message}`, 'error');
      if (btn) { btn.disabled = false; btn.textContent = '▶ Run'; }
    }
    setTimeout(loadCron, 8000);
  }

  async function viewLog(script, name) {
    const modal = document.getElementById('log-modal');
    document.getElementById('log-modal-title').textContent = name;
    document.getElementById('log-modal-meta').textContent  = 'Loading…';
    document.getElementById('log-modal-pre').textContent   = '';
    modal.classList.add('open');
    try {
      const data = await apiFetch(`/cron/log?script=${encodeURIComponent(script)}`);
      document.getElementById('log-modal-pre').textContent = data.lines || '(empty)';
      const meta = data.truncated
        ? `Last 600 of ${data.total_lines} lines · ${fmtBytes(data.size)}`
        : `${data.total_lines} lines · ${fmtBytes(data.size)}`;
      document.getElementById('log-modal-meta').textContent = meta;
      const pre = document.getElementById('log-modal-pre');
      pre.scrollTop = pre.scrollHeight;
    } catch (err) {
      document.getElementById('log-modal-pre').textContent = 'Error: ' + err.message;
      document.getElementById('log-modal-meta').textContent = '';
    }
  }

  function closeLogModal(e) {
    if (!e || e.target === document.getElementById('log-modal')) {
      document.getElementById('log-modal').classList.remove('open');
    }
  }

  function fmtBytes(n) {
    if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n > 1024)    return (n / 1024).toFixed(0) + ' KB';
    return n + ' B';
  }

  async function reloadWorkbook() {
    const btn = document.getElementById('btn-wb-reload');
    const status = document.getElementById('wb-reload-status');
    btn.disabled = true;
    btn.textContent = '…';
    status.textContent = '';
    try {
      const data = await apiFetch('/admin/workbook/reload', { method: 'POST' });
      showToast('Workbook cache cleared — dashboard will show fresh data on next load.', 'success');
      status.textContent = 'Cleared at ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      status.style.color = 'var(--ok)';
    } catch (err) {
      showToast('Reload failed: ' + err.message, 'error');
      status.textContent = 'Failed: ' + err.message;
      status.style.color = 'var(--danger)';
    }
    btn.disabled = false;
    btn.textContent = '↺ Reload Workbook Cache';
  }
});
</script>
</body>
</html>
