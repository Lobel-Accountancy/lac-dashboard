<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC CPE Compliance</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cpe-row {
      display: grid;
      grid-template-columns: 1fr 56px 56px 56px 110px 90px;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .cpe-row:last-child { border-bottom: none; }
    .cpe-row:nth-child(even) { background: rgba(255,255,255,.025); }
    .cpe-row:hover { background: rgba(255,255,255,.06); transition: background .1s; }

    .cpe-header {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-2);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 56px 56px 56px 110px 90px;
      gap: 8px;
    }

    .cpe-label { color: var(--text); }
    .cpe-num   { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }

    .progress-wrap { height: 6px; background: var(--muted-bg); border-radius: 3px; overflow: hidden; }
    .progress-bar  { height: 100%; border-radius: 3px; background: var(--accent-green, #4caf7d); transition: width .4s ease; }
    .progress-bar--warn { background: var(--warning); }
    .pct-label { font-size: 11px; color: var(--text-3); margin-top: 3px; text-align: right; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .status-badge--ok      { background: var(--ok-bg);      color: var(--ok); }
    .status-badge--needs   { background: var(--warning-bg); color: var(--warning); }
    .status-badge--overdue { background: var(--danger-bg);  color: var(--danger); }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      color: var(--text-2);
      font-size: 13px;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent-green, #4caf7d);
      background: rgba(76,175,125,.06);
      color: var(--text);
    }
    .upload-zone-icon { font-size: 28px; margin-bottom: 8px; }
    .upload-zone input[type=file] { display: none; }

    /* Preview table */
    .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .preview-table th {
      text-align: left; padding: 6px 8px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-2);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky; top: 0;
    }
    .preview-table td { padding: 8px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
    .preview-table tr:last-child td { border-bottom: none; }
    .preview-table tr:nth-child(even) td { background: rgba(255,255,255,.025); }
    .preview-table tbody tr:hover td { background: rgba(255,255,255,.06); }
    .fraud-yes { color: var(--accent-orange, #e8622a); font-weight: 600; }

    .preview-scroll { max-height: 340px; overflow-y: auto; }

    .import-btn {
      background: var(--accent-green, #4caf7d);
      color: #fff;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .import-btn:hover { opacity: .85; }
    .import-btn:disabled { opacity: .4; cursor: not-allowed; }

    @media (max-width: 640px) {
      .cpe-header, .cpe-row { grid-template-columns: 1fr 48px 48px 80px; }
      .cpe-header span:nth-child(3), .cpe-header span:nth-child(4),
      .cpe-row .cpe-num:nth-child(3), .cpe-row .cpe-num:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
<aside id="lac-sidebar"></aside>
<div class="page-body">
<main class="main">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
    <div>
      <div class="greeting">CPE Compliance</div>
      <div class="date-line" id="date-line"></div>
    </div>
    <button id="refresh-btn" onclick="refreshDashboard()" style="margin-top:8px;background:none;border:1px solid var(--border);color:var(--text-2);padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .15s,color .15s;" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--text-3)'" onmouseout="this.style.color='var(--text-2)';this.style.borderColor='var(--border)'">
      ↻ Refresh
    </button>
  </div>

  <div class="error-banner" id="error-banner" hidden></div>

  <!-- Becker Import Card -->
  <div class="card" style="margin-bottom:20px;">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Import Becker CPE</span>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="import-status" style="font-size:12px;font-weight:400;color:var(--text-3);"></span>
        <button onclick="clearCpeLog()" style="background:none;border:none;color:var(--danger,#e05252);font-size:12px;cursor:pointer;padding:0;opacity:.7;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.7" title="Clear all courses from CPE Log">Clear Log</button>
      </div>
    </div>
    <div class="card-body">
      <div class="upload-zone" id="upload-zone">
        <div class="upload-zone-icon">⬆</div>
        <div>Drop Becker Excel (.xlsx) here or <strong>click to browse</strong></div>
        <div style="font-size:11px;color:var(--text-3);margin-top:4px;">Export the Compliance Report from Becker as Excel. Courses are deduplicated and written to the CPE Log in the LAC Workbook.</div>
        <input type="file" id="csv-input" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv">
      </div>

      <div id="preview-wrap" hidden>
        <div style="margin:16px 0 12px;">
          <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;">Select periods to import</div>
          <div id="existing-note" style="font-size:12px;color:var(--text-3);"></div>
        </div>
        <div id="period-list" style="display:flex;flex-direction:column;gap:8px;"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;">
          <button onclick="resetUpload()" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:12px;">✕ Cancel</button>
          <button class="import-btn" id="confirm-btn" onclick="confirmImport()">Import to CPE Log</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CPE Credits Summary -->
  <div id="cpe-content">
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div class="skeleton-line skeleton-line--full"></div>
        <div class="skeleton-line skeleton-line--med"></div>
        <div class="skeleton-line skeleton-line--full"></div>
        <div class="skeleton-line skeleton-line--short"></div>
      </div>
    </div>
  </div>
</main>

<script src="js/nav.js?v=20260623"></script>
<script src="js/toast.js?v=20260623"></script>
<script src="js/palette.js?v=20260623"></script>
<script src="js/auth.js?v=20260623"></script>
<script>
  document.getElementById('date-line').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  let _pendingRows = [];

  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    loadDashboard();
    initUpload();
    setInterval(loadDashboard, 3 * 60 * 1000);
  });

  // ── Dashboard ─────────────────────────────────────────────────────────────

  async function refreshDashboard() {
    const btn = document.getElementById('refresh-btn');
    btn.textContent = '↻ Refreshing…';
    btn.disabled = true;
    await loadDashboard();
    btn.textContent = '↻ Refresh';
    btn.disabled = false;
  }

  async function loadDashboard() {
    try {
      const [compliance, log] = await Promise.all([
        apiFetch('/data/cpe-compliance').catch(() => null),
        apiFetch('/data/cpe-log').catch(() => null),
      ]);
      renderCompliance(compliance?.sections || []);
      renderCourseLog(log || {});
    } catch (err) {
      document.getElementById('error-banner').textContent = err.message;
      document.getElementById('error-banner').hidden = false;
      document.getElementById('cpe-content').innerHTML = '';
    }
  }

  // ── Compliance sections (original layout) ─────────────────────────────────
  function statusBadge(status) {
    const s = (status || '').toLowerCase();
    if (s === 'complete' || s === 'met' || s.includes('complete'))
      return `<span class="status-badge status-badge--ok">✓ Complete</span>`;
    if (s.includes('overdue'))
      return `<span class="status-badge status-badge--overdue">Overdue</span>`;
    if (s) return `<span class="status-badge status-badge--needs">${esc(status)}</span>`;
    return '';
  }

  function renderCompliance(sections) {
    const container = document.getElementById('cpe-content');
    if (!sections.length) {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = sections.map(sec => `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
          <span>${esc(sec.title)}</span>
          ${sec.period ? `<span style="font-weight:400;color:var(--text-3);font-size:12px;">${esc(sec.period)}</span>` : ''}
        </div>
        <div class="cpe-header">
          <span>Requirement</span>
          <span style="text-align:right">Req'd</span>
          <span style="text-align:right">Earned</span>
          <span style="text-align:right">Left</span>
          <span>Progress</span>
          <span>Status</span>
        </div>
        ${sec.rows.map(r => {
          const pct = Math.min(r.pct, 100);
          return `<div class="cpe-row">
            <span class="cpe-label">${esc(r.requirement)}</span>
            <span class="cpe-num">${r.required}</span>
            <span class="cpe-num">${r.earned}</span>
            <span class="cpe-num">${r.remaining}</span>
            <div>
              <div class="progress-wrap"><div class="progress-bar${pct < 50 ? ' progress-bar--warn' : ''}" style="width:${pct}%"></div></div>
              <div class="pct-label">${pct}%</div>
            </div>
            <div>${statusBadge(r.status)}</div>
          </div>`;
        }).join('')}
      </div>`).join('');
  }

  // ── Course log (new section below compliance) ─────────────────────────────
  function renderCourseLog(data) {
    const courses = data.courses || [];
    const total   = data.total_credits || 0;
    const count   = data.course_count  || 0;

    // Remove old course section if present
    const old = document.getElementById('course-log-section');
    if (old) old.remove();

    const section = document.createElement('div');
    section.id = 'course-log-section';

    if (!count) {
      section.innerHTML = `<p style="color:var(--text-2);font-size:13px;padding:8px 0;">
        No courses in CPE Log yet — upload the Becker Compliance Report (.xlsx) above to populate.
      </p>`;
      document.getElementById('cpe-content').after(section);
      return;
    }

    const rows = courses.map(c => {
      const isFraud = c.fraud_topic === 'Yes';
      const fraudBtn = `<button
          onclick="toggleFraud(this,'${esc(c.course_name).replace(/'/g,"\\'")}','${esc(c.completed_on)}')"
          title="${isFraud ? 'Remove fraud flag' : 'Flag as fraud-related'}"
          style="background:none;border:1px solid ${isFraud ? 'rgba(232,98,42,.5)' : 'var(--border)'};
                 border-radius:5px;padding:2px 7px;cursor:pointer;font-size:11px;
                 color:${isFraud ? '#e8622a' : 'var(--text-3)'};
                 transition:all .15s;white-space:nowrap;"
          onmouseover="this.style.borderColor='#e8622a';this.style.color='#e8622a'"
          onmouseout="this.style.borderColor='${isFraud ? 'rgba(232,98,42,.5)' : 'var(--border)'}';this.style.color='${isFraud ? '#e8622a' : 'var(--text-3)'}'">
          ${isFraud ? '🚩 Fraud' : 'Flag Fraud'}
        </button>`;
      return `
        <div class="cpe-row" style="grid-template-columns:1fr 50px 110px 1fr 100px;">
          <span class="cpe-label">
            ${esc(c.course_name)}
            ${c.acfe_eligible==='Yes'?'<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(42,184,160,.18);color:#2ab8a0;margin-left:6px;font-weight:700;">ACFE</span>':''}
          </span>
          <span class="cpe-num">${c.credits%1===0?c.credits:c.credits.toFixed(1)}</span>
          <span style="font-size:12px;color:var(--text-2);">${esc(c.completed_on)}</span>
          <span style="font-size:12px;color:var(--text-2);">${esc(c.field_of_study)}</span>
          <span style="display:flex;align-items:center;">${fraudBtn}</span>
        </div>`;
    }).join('');

    section.innerHTML = `
      <div class="card">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Courses Completed</span>
          <span style="font-size:12px;font-weight:400;color:var(--text-3);">
            ${count} course${count!==1?'s':''} · ${total%1===0?total:total.toFixed(1)} total credits
          </span>
        </div>
        <div class="cpe-header" style="grid-template-columns:1fr 50px 110px 1fr 100px;">
          <span>Course</span><span style="text-align:right">Cr</span>
          <span>Completed</span><span>Field</span><span>Fraud</span>
        </div>
        <div style="max-height:400px;overflow-y:auto;">${rows}</div>
      </div>`;
    document.getElementById('cpe-content').after(section);
  }

  // ── Upload ────────────────────────────────────────────────────────────────

  function initUpload() {
    const zone  = document.getElementById('upload-zone');
    const input = document.getElementById('csv-input');

    zone.addEventListener('click', () => input.click());
    input.addEventListener('change', () => { if (input.files[0]) handleFile(input.files[0]); });

    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  }

  let _periodData = [];  // [{period, count, is_current, is_expired, courses}]

  async function handleFile(file) {
    setImportStatus('Parsing…');
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await apiFetchRaw('/cpe/preview', { method: 'POST', body: form });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      _periodData = data.periods || [];
      const totalNew = _periodData.reduce((s, p) => s + p.count, 0);
      if (!totalNew) {
        setImportStatus(`All ${data.existing_count} courses already in log — nothing to import.`);
        return;
      }
      showPeriodPicker(_periodData, data.existing_count);
      setImportStatus('');
    } catch (err) {
      setImportStatus(`Error: ${err.message}`);
    }
  }

  function showPeriodPicker(periods, existingCount) {
    document.getElementById('upload-zone').hidden = true;
    document.getElementById('preview-wrap').hidden = false;
    document.getElementById('existing-note').textContent =
      existingCount ? `${existingCount} course${existingCount !== 1 ? 's' : ''} already in log (skipped)` : '';

    document.getElementById('period-list').innerHTML = periods.map((p, i) => {
      const checked = p.is_current ? 'checked' : '';
      const label   = p.is_current ? 'Current' : p.is_expired ? 'Expired' : 'Future';
      const labelColor = p.is_current
        ? 'background:rgba(76,175,125,.18);color:#4caf7d;'
        : p.is_expired
          ? 'background:rgba(255,255,255,.08);color:var(--text-3);'
          : 'background:rgba(100,160,255,.18);color:#64a0ff;';
      return `
        <label style="display:flex;align-items:center;gap:12px;padding:12px 16px;
               border:1px solid var(--border);border-radius:8px;cursor:pointer;
               transition:border-color .15s,background .15s;"
               onmouseover="this.style.borderColor='var(--text-3)'"
               onmouseout="this.style.borderColor='var(--border)'">
          <input type="checkbox" data-idx="${i}" ${checked}
                 onchange="updatePendingRows()"
                 style="width:16px;height:16px;accent-color:var(--accent-green,#4caf7d);cursor:pointer;">
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:600;color:var(--text);">${esc(p.period)}</div>
            <div style="font-size:12px;color:var(--text-3);margin-top:2px;">
              ${p.count} course${p.count !== 1 ? 's' : ''}
            </div>
          </div>
          <span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap;${labelColor}">${label}</span>
        </label>`;
    }).join('');

    updatePendingRows();
  }

  function updatePendingRows() {
    const checkboxes = document.querySelectorAll('#period-list input[type=checkbox]');
    _pendingRows = [];
    checkboxes.forEach(cb => {
      if (cb.checked) {
        const p = _periodData[parseInt(cb.dataset.idx)];
        _pendingRows.push(...p.courses);
      }
    });
    const btn = document.getElementById('confirm-btn');
    if (_pendingRows.length) {
      btn.disabled = false;
      btn.textContent = `Import ${_pendingRows.length} course${_pendingRows.length !== 1 ? 's' : ''} to CPE Log`;
    } else {
      btn.disabled = true;
      btn.textContent = 'Select a period above';
    }
  }

  async function confirmImport() {
    const btn = document.getElementById('confirm-btn');
    btn.disabled = true;
    btn.textContent = 'Importing…';
    try {
      const data = await apiFetch('/cpe/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rows: _pendingRows }),
      });
      showToast(`${data.added} course${data.added !== 1 ? 's' : ''} added to CPE Log`, 'success');
      resetUpload();
      loadDashboard();
    } catch (err) {
      showToast(`Import failed: ${err.message}`, 'error');
      btn.disabled = false;
      updatePendingRows();
    }
  }

  function resetUpload() {
    _pendingRows = [];
    _periodData  = [];
    document.getElementById('upload-zone').hidden = false;
    document.getElementById('preview-wrap').hidden = true;
    document.getElementById('csv-input').value = '';
    setImportStatus('');
  }

  function setImportStatus(msg) {
    document.getElementById('import-status').textContent = msg;
  }

  // ── Fraud flag ────────────────────────────────────────────────────────────

  async function toggleFraud(btn, courseName, completedOn) {
    const isFraud = btn.textContent.trim().startsWith('🚩');
    const newFlagged = !isFraud;
    btn.disabled = true;
    btn.textContent = '…';
    try {
      await apiFetch('/cpe/flag-fraud', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ course_name: courseName, completed_on: completedOn, flagged: newFlagged }),
      });
      // Refresh course log to reflect updated fraud topic
      const log = await apiFetch('/data/cpe-log').catch(() => null);
      if (log) renderCourseLog(log);
      showToast(newFlagged ? 'Flagged as fraud-related' : 'Fraud flag removed', 'success');
    } catch (err) {
      showToast(`Error: ${err.message}`, 'error');
      btn.disabled = false;
      btn.textContent = isFraud ? '🚩 Fraud' : 'Flag Fraud';
    }
  }

  // ── Clear log ─────────────────────────────────────────────────────────────

  async function clearCpeLog() {
    if (!confirm('This will remove all courses from the CPE Log in the LAC Workbook. Are you sure?')) return;
    try {
      const data = await apiFetch('/cpe/clear', { method: 'POST' });
      showToast(`CPE Log cleared (${data.rows_cleared} rows removed)`, 'success');
      loadDashboard();
    } catch (err) {
      showToast(`Clear failed: ${err.message}`, 'error');
    }
  }

  // ── Helpers ───────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function apiFetchRaw(path, opts = {}) {
    const jwt = getJWT();
    opts.headers = opts.headers || {};
    if (!(opts.body instanceof FormData)) opts.headers['Content-Type'] = opts.headers['Content-Type'] || 'application/json';
    opts.headers['Authorization'] = `Bearer ${jwt}`;
    return fetch(`${AUTH_URL}${path}`, opts).then(r => {
      if (!r.ok) return r.json().catch(() => ({ error: `HTTP ${r.status}` })).then(d => { throw new Error(d.error || r.statusText); });
      return r;
    });
  }
</script>
<script src="js/card-resize.js?v=20260623"></script>
<script src="js/chat.js?v=20260623"></script>
</div>
</body>
</html>
