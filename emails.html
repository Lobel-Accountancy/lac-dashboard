<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC Email</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-links { display: flex; gap: 4px; margin: 0 16px; }
    .nav-link {
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 4px;
      transition: color .15s, background .15s;
    }
    .nav-link:hover    { color: white; background: rgba(255,255,255,.1); }
    .nav-link--active  { color: white; background: rgba(255,255,255,.15); }

    /* ---- Alias tab bar ---- */
    .alias-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 0 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
    }
    .alias-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .alias-btn:hover  { border-color: var(--blue); color: var(--blue); }
    .alias-btn.active {
      background: var(--navy);
      border-color: var(--navy);
      color: white;
    }
    .alias-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      background: var(--danger);
      color: white;
    }
    .alias-btn.active .alias-badge  { background: rgba(255,255,255,.25); }
    .alias-badge[data-count="0"]    { display: none; }

    /* ---- Email list ---- */
    .email-list { display: flex; flex-direction: column; gap: 2px; }

    .email-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .1s;
    }
    .email-item:hover { background: #f5f7fa; }
    .email-item.expanded { background: #f8fafc; }

    .email-avatar {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: white;
      margin-top: 1px;
    }

    .email-body { flex: 1; min-width: 0; }

    .email-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }
    .email-from {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .email-date {
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .email-subject {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .email-snippet {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.5;
    }
    .email-snippet.collapsed {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Status bar ---- */
    .email-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .email-status-text { font-size: 12px; color: var(--text-3); }

    .btn-refresh {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-2);
      cursor: pointer;
      transition: background .15s;
    }
    .btn-refresh:hover { background: var(--muted-bg); }

    .error-banner {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 12px;
    }

    /* ---- Reply button ---- */
    .reply-row {
      margin-top: 10px;
    }
    .btn-reply {
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-reply:hover { opacity: .85; }

    /* ---- Reply modal ---- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
      width: 560px;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--navy);
      color: white;
    }
    .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: rgba(255,255,255,.7);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .modal-close:hover { color: white; }
    .modal-fields {
      padding: 16px 18px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .modal-field label {
      width: 56px;
      flex-shrink: 0;
      color: var(--text-2);
      font-weight: 500;
    }
    .modal-field input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      color: var(--text);
      background: var(--muted-bg);
    }
    .modal-body-wrap { padding: 10px 18px 0; }
    .modal-body-wrap textarea {
      width: 100%;
      height: 200px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
      line-height: 1.5;
    }
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px 16px;
    }
    .modal-error { font-size: 12px; color: var(--danger); }
    .btn-send {
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-send:hover   { opacity: .85; }
    .btn-send:disabled { opacity: .5; cursor: default; }
    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
    }
    .btn-cancel:hover { background: var(--muted-bg); }

    /* ---- AI buttons ---- */
    .btn-ai-sm {
      background: none;
      border: 1px solid var(--blue, #2E6DA4);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--blue, #2E6DA4);
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-ai-sm:hover:not(:disabled) { background: var(--blue, #2E6DA4); color: #fff; }
    .btn-ai-sm:disabled { opacity: .5; cursor: default; }

    .email-ai-summary {
      margin-top: 10px;
      padding: 10px 12px;
      background: #EEF5FF;
      border-left: 3px solid var(--blue, #2E6DA4);
      border-radius: 4px;
      font-size: 12px;
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .email-ai-summary.loading { color: var(--text-3); font-style: italic; }
    .email-ai-summary.error { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

    .btn-draft {
      background: none;
      border: 1px solid var(--blue, #2E6DA4);
      border-radius: 4px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--blue, #2E6DA4);
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-draft:hover:not(:disabled) { background: var(--blue, #2E6DA4); color: #fff; }
    .btn-draft:disabled { opacity: .5; cursor: default; }
  </style>

<main class="main">
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;">
    <h2 style="font-size:20px;font-weight:700;color:var(--navy);">Inbox</h2>
  </div>

  <div class="alias-bar">
    <button class="alias-btn active" id="tab-jlobel" onclick="switchAlias('jlobel')">
      jlobel@ <span class="alias-badge" id="count-jlobel" data-count="0">0</span>
    </button>
    <button class="alias-btn" id="tab-info" onclick="switchAlias('info')">
      info@ <span class="alias-badge" id="count-info" data-count="0">0</span>
    </button>
    <button class="alias-btn" id="tab-billing" onclick="switchAlias('billing')">
      billing@ <span class="alias-badge" id="count-billing" data-count="0">0</span>
    </button>
    <div style="flex:1;"></div>
    <span id="refresh-status" style="font-size:12px;color:var(--text-3);"></span>
    <button class="btn-refresh" onclick="loadEmails(true)">↻ Refresh</button>
  </div>

  <div id="error-banner" class="error-banner" hidden></div>
  <div id="email-list"><span class="empty-state">Loading…</span></div>
</main>

<!-- Reply modal -->
<div id="reply-modal" class="modal-backdrop" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <h3>Reply</h3>
      <button class="modal-close" onclick="closeReply()">&times;</button>
    </div>
    <div class="modal-fields">
      <div class="modal-field">
        <label>To</label>
        <input id="reply-to" type="email" readonly>
      </div>
      <div class="modal-field">
        <label>Subject</label>
        <input id="reply-subject" type="text">
      </div>
    </div>
    <div class="modal-body-wrap">
      <textarea id="reply-body" placeholder="Write your reply…"></textarea>
    </div>
    <input type="hidden" id="reply-message-id">
    <div class="modal-footer">
      <span class="modal-error" id="reply-error"></span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn-draft" id="draft-btn" onclick="draftReply(_replyEmailIndex)">✦ Draft Reply</button>
        <button class="btn-cancel" onclick="closeReply()">Cancel</button>
        <button class="btn-send" id="reply-send-btn" onclick="sendReply()">Send</button>
      </div>
    </div>
  </div>
</div>
