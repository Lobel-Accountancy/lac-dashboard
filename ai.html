<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAC AI Assistant</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html { height: 100%; overflow: hidden; }
    .main { padding: 0; height: calc(100vh - 52px); }
    .ai-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .ai-loading {
      position: absolute;
      top: 52px; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text-3);
      font-size: 14px;
      pointer-events: none;
      transition: opacity .3s;
    }
    .ai-loading.hidden { opacity: 0; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2A3F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAC">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <div class="nav-brand">LAC</div>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Briefing</a>
      <a class="nav-link" href="bi.html">Analytics</a>
      <a class="nav-link" href="clients.html">Clients</a>
      <a class="nav-link" href="engagement.html">Pipeline</a>
      <a class="nav-link" href="forecast.html">Forecast</a>
      <a class="nav-link" href="budget.html">Budget</a>
      <a class="nav-link" href="financials.html">Financials</a>
      <a class="nav-link" href="docs.html">Documents</a>
      <a class="nav-link" href="emails.html">Emails</a>
      <a class="nav-link" href="activity.html">Activity</a>
      <a class="nav-link" href="drive.html">Drive</a>
      <a class="nav-link" href="audit-tools.html">Audit Tools</a>
      <a class="nav-link active" href="ai.html">AI</a>
      <a class="nav-link" href="pdf.html">PDF Tools</a>
      <a class="nav-link" href="signatures.html">Signatures</a>
      <a class="nav-link" href="https://clients.lobelaccountancy.com" target="_blank" rel="noopener">Client Portal ↗</a>
      <a class="nav-link" href="bookmarks.html">Bookmarks</a>
    </div>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <button class="nav-logout" onclick="logout()">Sign out</button>
  </div>
</nav>

<div class="ai-loading" id="ai-loading">Loading AI Assistant…</div>
<main class="main">
  <iframe
    class="ai-frame"
    id="ai-frame"
    src="https://ai.lobelaccountancy.com"
    title="LAC AI Assistant"
    allow="microphone"
  ></iframe>
</main>

<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;
    const payload = jwtPayload(getJWT());
    document.getElementById('nav-user').textContent = (payload?.email || '').split('@')[0];
    document.getElementById('ai-frame').addEventListener('load', () => {
      document.getElementById('ai-loading').classList.add('hidden');
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
